<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>


<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">


    <form class="bg-white p-6 rounded-xl shadow-md w-full max-w-md">
        
        <fieldset class="border border-gray-300 p-4 rounded-lg mb-4">
            
            <legend class="text-lg font-bold text-gray-800 px-2">Dados Pessoais:</legend>


            <label for="nome-cliente" class="block text-sm font-bold text-gray-700 mb-1">Nome:</label>
            <input type="text" placeholder="Ex.: Pedro Paulo" id="nome-cliente" name="nome" autocomplete="name" maxlength="100" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">


            <label for="idade-cliente" class="block text-sm font-bold text-gray-700 mb-1">Idade:</label>
            <input type="number" placeholder="Ex.: 28" id="idade-cliente" name="idade" min="0" max="150" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">


            <label for="endereco-cliente" class="block text-sm font-bold text-gray-700 mb-1">Endereço:</label>
            <input type="text" placeholder="Ex.: Avenida das Maravilhas 123" id="endereco-cliente" name="endereco" maxlength="100" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg mb\\\\-4 focus:outline-none focus:ring-2 focus:ring-blue-500">


            <label for="email-cliente" class="block text-sm font-bold text-gray-700 mb-1">E-mail:</label>
            <input type="email" placeholder="Ex.: pedro.paulo12@gmail.com" id="email-cliente" name="email" autocomplete="email" maxlength="100" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">


            <label for="cpf-cliente" class="block text-sm font-bold text-gray-700 mb-1">CPF:</label>
            <input type="text" placeholder="Ex.: 000.000.000-00" id="cpf-cliente" name="cpf" maxlength="14" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">


        </fieldset>


        <button type="submit" 
            class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-blue-700 transition cursor-pointer">
            Cadastrar
        </button>


    </form>


</body>
</html>
